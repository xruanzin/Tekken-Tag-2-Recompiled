name: Windows host

on:
  push:
    branches: [ main, windows-host ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch pinned source dependencies
        run: py tools/setup_deps.py

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".vcpkg-cache" | Out-Null
          $Vcpkg = "$env:RUNNER_TEMP/vcpkg"
          New-Item -ItemType Directory -Force $Vcpkg | Out-Null
          git -C $Vcpkg init --quiet
          git -C $Vcpkg remote add origin https://github.com/microsoft/vcpkg
          git -C $Vcpkg fetch --depth 1 origin c52f7bd748185ef0e0daf033d9f2ddfc8a3449ea
          git -C $Vcpkg checkout --detach FETCH_HEAD
          & "$Vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Build standalone launcher resource
        shell: pwsh
        run: |
          $ResourceDir = Join-Path $env:GITHUB_WORKSPACE "generated\windows-ci"
          New-Item -ItemType Directory -Force $ResourceDir | Out-Null

          $Theme = (Resolve-Path "launcher\assets\ttt2_launcher_theme.jpg").Path.Replace("\", "/")
          $Rc = Join-Path $ResourceDir "ttt2-launcher.rc"
          $Res = Join-Path $ResourceDir "ttt2-launcher.res"

          Set-Content -LiteralPath $Rc -Encoding ASCII -Value "101 RCDATA `"$Theme`""
          & llvm-rc "/fo" $Res $Rc
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Res)) {
              throw "Failed to build standalone launcher resource."
          }

          $CMakeResource = $Res.Replace("\", "/")
          "TTT2_WINDOWS_RESOURCE=$CMakeResource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Clang/LLVM, x64)
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTTT2_WINDOWS_RESOURCE="$env:TTT2_WINDOWS_RESOURCE"

      - name: Compile host runtime, tools and launcher
        run: cmake --build build/windows --target cafe_runtime cafe-recomp cafe-shader ttt2_launcher title_test memory_model_test wua_layers_test

      - name: Run data-independent tests
        run: ctest --test-dir build/windows -C Release --output-on-failure -R "title_test|memory_model_test|wua_layers_test"

      - name: Validate first-run PowerShell scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content "build-windows.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "setup\prepare-game.ps1" -Raw)) | Out-Null

      - name: Upload standalone Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: TTT2-Windows-Launcher
          path: build/windows/TTT2 Launcher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release package
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          $Version = (Get-Content ".github\release-version.txt" -Raw).Trim()
          if ($Version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+[-A-Za-z0-9.]*$') {
              throw "Invalid release version: $Version"
          }

          $DistRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $Package = Join-Path $DistRoot "TTT2-Windows-$Version"
          New-Item -ItemType Directory -Force $Package | Out-Null

          Copy-Item "build\windows\TTT2 Launcher.exe" (Join-Path $Package "TTT2 Launcher.exe") -Force
          Copy-Item "README.md" (Join-Path $Package "README.md") -Force
          Copy-Item "LICENSE" (Join-Path $Package "LICENSE") -Force
          Copy-Item "CMakeLists.txt" (Join-Path $Package "CMakeLists.txt") -Force
          Copy-Item "build-windows.ps1" (Join-Path $Package "build-windows.ps1") -Force
          Copy-Item "vcpkg.json" (Join-Path $Package "vcpkg.json") -Force
          Copy-Item "dependencies.lock.json" (Join-Path $Package "dependencies.lock.json") -Force
          foreach ($Directory in @("runtime", "recomp", "tools", "tests", "launcher", "setup", "docs")) {
              Copy-Item $Directory (Join-Path $Package $Directory) -Recurse -Force
          }

          @"
          TTT2 Recompiled - Windows Launcher $Version

          This package contains the Windows launcher and the automatic first-run preparation files.

          First run:
          1. Open TTT2 Launcher.exe.
          2. Select the extracted European v16 game folder (code/content/meta).
          3. Click PREPARAR JOGO / PREPARE GAME.
          4. The launcher validates code\Tekken.rpx and prepares game\ttt2.exe locally.

          Required build tools are detected automatically and, when missing, the setup uses
          Windows Package Manager to install them without opening a command window.

          The package does NOT contain Tekken game files, Tekken.rpx, generated game C++ code
          or a prebuilt game-derived ttt2.exe.

          Original Linux port: Petexy/Tekken-Tag-2-Recompiled
          Windows port: xruanzin
          "@ | Set-Content -LiteralPath (Join-Path $Package "README-FIRST.txt") -Encoding UTF8

          $Zip = Join-Path $DistRoot "TTT2-Windows-$Version.zip"
          Compress-Archive -Path (Join-Path $Package "*") -DestinationPath $Zip -CompressionLevel Optimal -Force

          $Standalone = Join-Path $DistRoot "TTT2-Launcher-$Version.exe"
          Copy-Item "build\windows\TTT2 Launcher.exe" $Standalone -Force

          @"
          ## TTT2 Recompiled Windows $Version

          Windows preview release with automatic first-run preparation for the Windows host fork.

          ### Included
          - Standalone native Windows launcher with the launcher artwork embedded in the executable.
          - Display, graphics, audio, language and controller settings.
          - Sharpness and volume sliders with the fixed Windows 11 rendering/dragging behavior.
          - Windows-focused runtime configuration and AMD integrated-GPU performance presets.
          - ZIP package with the launcher, automatic first-run setup, Windows documentation and license.
          - First-run flow that creates game/ttt2.exe locally from the user's own EU v16 game folder.
          - No PowerShell/build terminal is shown; setup and runtime diagnostics are written under logs/.

          ### Important
          This release does **not** distribute `ttt2.exe`, `Tekken.rpx`, generated game code,
          or any Tekken game data. Build `ttt2.exe` locally from your own legally obtained
          European v16 copy by following the repository instructions.

          ### Credits
          Original Linux port and core static-recompilation work: **Petexy and upstream contributors**.
          Windows port, launcher and Windows-specific integration: **xruanzin**.
          AI-assisted code review/debugging/documentation: **OpenAI ChatGPT**.
          "@ | Set-Content -LiteralPath (Join-Path $DistRoot "release-notes.md") -Encoding UTF8

          "RELEASE_TAG=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_EXE=$Standalone" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$Zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES=$(Join-Path $DistRoot 'release-notes.md')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub pre-release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "$env:RELEASE_EXE" `
            "$env:RELEASE_ZIP" `
            --target "$env:GITHUB_SHA" `
            --title "TTT2 Recompiled Windows $env:RELEASE_TAG" `
            --notes-file "$env:RELEASE_NOTES" `
            --prerelease
