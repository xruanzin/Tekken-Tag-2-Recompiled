name: Windows host

on:
  push:
    branches: [ main, windows-host ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch pinned source dependencies
        run: py tools/setup_deps.py

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".vcpkg-cache" | Out-Null
          $Vcpkg = "$env:RUNNER_TEMP/vcpkg"
          New-Item -ItemType Directory -Force $Vcpkg | Out-Null
          git -C $Vcpkg init --quiet
          git -C $Vcpkg remote add origin https://github.com/microsoft/vcpkg
          git -C $Vcpkg fetch --depth 1 origin c52f7bd748185ef0e0daf033d9f2ddfc8a3449ea
          git -C $Vcpkg checkout --detach FETCH_HEAD
          & "$Vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Build standalone launcher resource
        shell: pwsh
        run: |
          $ResourceDir = Join-Path $env:GITHUB_WORKSPACE "generated\windows-ci"
          New-Item -ItemType Directory -Force $ResourceDir | Out-Null

          $Theme = (Resolve-Path "launcher\assets\ttt2_launcher_theme.jpg").Path.Replace("\", "/")
          $Rc = Join-Path $ResourceDir "ttt2-launcher.rc"
          $Res = Join-Path $ResourceDir "ttt2-launcher.res"

          Set-Content -LiteralPath $Rc -Encoding ASCII -Value "101 RCDATA `"$Theme`""
          & llvm-rc "/fo" $Res $Rc
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Res)) {
              throw "Failed to build standalone launcher resource."
          }

          $CMakeResource = $Res.Replace("\", "/")
          "TTT2_WINDOWS_RESOURCE=$CMakeResource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Clang/LLVM, x64)
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTTT2_WINDOWS_RESOURCE="$env:TTT2_WINDOWS_RESOURCE"

      - name: Compile host runtime, generic game host, tools and launcher
        run: cmake --build build/windows --target cafe_runtime cafe-recomp cafe-shader ttt2_dynamic ttt2_launcher title_test memory_model_test wua_layers_test

      - name: Run data-independent tests
        run: ctest --test-dir build/windows -C Release --output-on-failure -R "title_test|memory_model_test|wua_layers_test"

      - name: Upload ready-to-run Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: TTT2-Windows-Preview
          path: |
            build/windows/TTT2 Launcher.exe
            build/windows/ttt2.exe
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release package
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        run: |
          $Version = (Get-Content ".github\release-version.txt" -Raw).Trim()
          if ($Version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+[-A-Za-z0-9.]*$') {
              throw "Invalid release version: $Version"
          }

          $DistRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $Package = Join-Path $DistRoot "TTT2-Windows-$Version"
          New-Item -ItemType Directory -Force $Package | Out-Null

          Copy-Item "build\windows\TTT2 Launcher.exe" (Join-Path $Package "TTT2 Launcher.exe") -Force
          Copy-Item "build\windows\ttt2.exe" (Join-Path $Package "ttt2.exe") -Force
          Copy-Item "README.md" (Join-Path $Package "README.md") -Force
          Copy-Item "LICENSE" (Join-Path $Package "LICENSE") -Force

          @"
          TTT2 Recompiled - Windows $Version

          This package contains the ready-to-run Windows launcher and generic native host.

          First run:
          1. Open TTT2 Launcher.exe.
          2. Select your legally obtained European v16 extracted game folder or supported .wua.
          3. Click JOGAR / PLAY.

          No compiler, CMake, Ninja, Python, Visual Studio Build Tools or first-run compilation
          is required. The included ttt2.exe reads and validates the user's RPX at runtime.

          The package does NOT contain Tekken game files, Tekken.rpx or generated game code.

          Original Linux port: Petexy/Tekken-Tag-2-Recompiled
          Windows port: xruanzin
          "@ | Set-Content -LiteralPath (Join-Path $Package "README-FIRST.txt") -Encoding UTF8

          $Zip = Join-Path $DistRoot "TTT2-Windows-$Version.zip"
          Compress-Archive -Path (Join-Path $Package "*") -DestinationPath $Zip -CompressionLevel Optimal -Force

          $Standalone = Join-Path $DistRoot "TTT2 Launcher.exe"
          Copy-Item "build\windows\TTT2 Launcher.exe" $Standalone -Force

          $HostExe = Join-Path $DistRoot "ttt2.exe"
          Copy-Item "build\windows\ttt2.exe" $HostExe -Force

          @"
          ## TTT2 Recompiled Windows $Version

          Windows preview release with a ready-to-run generic host for the Windows fork.

          ### Included
          - Standalone native Windows launcher with the launcher artwork embedded in the executable.
          - Display, graphics, audio, language and controller settings.
          - Sharpness and volume sliders with the fixed Windows 11 rendering/dragging behavior.
          - Windows-focused runtime configuration and AMD integrated-GPU performance presets.
          - Ready-to-run generic ttt2.exe host included with the launcher.
          - No first-run C++ compilation and no local build toolchain required.
          - On-demand baseline x86-64 block JIT with a persistent warm block cache.
          - The user only selects their own EU v16 game folder or supported .wua and presses PLAY.
          - No terminal window is shown; runtime diagnostics are written to logs/ttt2-last-run.txt.

          ### Important
          The included `ttt2.exe` is a generic host and contains no precompiled Tekken game code.
          This release does **not** distribute `Tekken.rpx`, generated game code, or any Tekken
          game data. The user's own EU v16 executable is validated and loaded at runtime.

          ### Credits
          Original Linux port and core static-recompilation work: **Petexy and upstream contributors**.
          Windows port, launcher and Windows-specific integration: **xruanzin**.
          AI-assisted code review/debugging/documentation: **OpenAI ChatGPT**.
          "@ | Set-Content -LiteralPath (Join-Path $DistRoot "release-notes.md") -Encoding UTF8

          "RELEASE_TAG=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_EXE=$Standalone" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_HOST=$HostExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$Zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NOTES=$(Join-Path $DistRoot 'release-notes.md')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub pre-release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "$env:RELEASE_EXE" `
            "$env:RELEASE_HOST" `
            "$env:RELEASE_ZIP" `
            --target "$env:GITHUB_SHA" `
            --title "TTT2 Recompiled Windows $env:RELEASE_TAG" `
            --notes-file "$env:RELEASE_NOTES" `
            --prerelease
