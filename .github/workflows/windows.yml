name: Windows host

on:
  push:
    branches: [ main, windows-host ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch pinned source dependencies
        run: py tools/setup_deps.py

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".vcpkg-cache" | Out-Null
          $Vcpkg = "$env:RUNNER_TEMP/vcpkg"
          New-Item -ItemType Directory -Force $Vcpkg | Out-Null
          git -C $Vcpkg init --quiet
          git -C $Vcpkg remote add origin https://github.com/microsoft/vcpkg
          git -C $Vcpkg fetch --depth 1 origin c52f7bd748185ef0e0daf033d9f2ddfc8a3449ea
          git -C $Vcpkg checkout --detach FETCH_HEAD
          & "$Vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Build standalone launcher resource
        shell: pwsh
        run: |
          $ResourceDir = Join-Path $env:GITHUB_WORKSPACE "generated\windows-ci"
          New-Item -ItemType Directory -Force $ResourceDir | Out-Null

          $Theme = (Resolve-Path "launcher\assets\ttt2_launcher_theme.jpg").Path.Replace("\", "/")
          $Rc = Join-Path $ResourceDir "ttt2-launcher.rc"
          $Res = Join-Path $ResourceDir "ttt2-launcher.res"

          Set-Content -LiteralPath $Rc -Encoding ASCII -Value "101 RCDATA `"$Theme`""
          & llvm-rc "/fo" $Res $Rc
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $Res)) {
              throw "Failed to build standalone launcher resource."
          }

          $CMakeResource = $Res.Replace("\", "/")
          "TTT2_WINDOWS_RESOURCE=$CMakeResource" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Clang/LLVM, x64)
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DTTT2_EXPERIMENTAL_DYNAMIC_HOST=ON `
            -DTTT2_WINDOWS_RESOURCE="$env:TTT2_WINDOWS_RESOURCE"

      - name: Compile host tools, launchers and game-independent tests
        run: cmake --build build/windows --target cafe_runtime cafe-recomp cafe-shader ttt2_dynamic ttt2_launcher ttt2_player_launcher ttt2_play title_test memory_model_test wua_layers_test dynamic_semantics_test

      - name: Run data-independent tests
        run: ctest --test-dir build/windows -C Release --output-on-failure -R "title_test|memory_model_test|wua_layers_test|dynamic_semantics_test"

      - name: Validate release/preparation script syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content "release-windows.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "release-player.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "build-windows.ps1" -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content "tools/prepare-player.ps1" -Raw)) | Out-Null

      - name: Build generic Player ZIP
        shell: pwsh
        run: |
          .\release-player.ps1 -Version v0.0.0-ci -SkipBuild
          if (-not (Test-Path "dist\TTT2-Windows-v0.0.0-ci.zip")) {
              throw "Generic Player ZIP was not produced."
          }

      - name: Upload generic Player ZIP CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTT2-Windows-Player-CI
          path: |
            dist/TTT2-Windows-v0.0.0-ci.zip
            dist/SHA256SUMS-PLAYER.txt
          if-no-files-found: error
          retention-days: 30

      - name: Stage launcher-only CI artifact
        shell: pwsh
        run: |
          $PreviewRoot = Join-Path $env:GITHUB_WORKSPACE "build\launcher-ci"
          New-Item -ItemType Directory -Force $PreviewRoot | Out-Null
          Copy-Item "build\windows\Tekken Tag Tournament 2.exe" (Join-Path $PreviewRoot "Tekken Tag Tournament 2.exe") -Force
          Copy-Item "build\windows\Play Tekken Tag Tournament 2.exe" (Join-Path $PreviewRoot "Play Tekken Tag Tournament 2.exe") -Force
          Copy-Item "README-Windows.txt" (Join-Path $PreviewRoot "README-Windows.txt") -Force

      - name: Upload launcher CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTT2-Windows-Launchers-CI
          path: build/launcher-ci/
          if-no-files-found: error
          retention-days: 30
