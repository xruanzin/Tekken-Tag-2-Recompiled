name: Windows host

on:
  push:
    branches: [ main, windows, win32, "windows-*" ]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch pinned source dependencies
        run: py tools/setup_deps.py

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure (Clang/LLVM, x64)
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Compile host runtime and tools
        run: cmake --build build/windows --target cafe_runtime cafe-recomp cafe-shader title_test memory_model_test wua_layers_test

      - name: Run data-independent tests
        run: ctest --test-dir build/windows -C Release --output-on-failure -R "title_test|memory_model_test|wua_layers_test"
